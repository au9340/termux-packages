name: Fork build

# 官方 .github/workflows/packages.yml 的 build job 的最小照抄版。
# 相对官方只有三处差异，其余（runner、docker 调用、产物打包、artifact 命名）完全一致：
#   1. 构建前把 TERMUX_APP__PACKAGE_NAME 换成 bin.mt.plus
#   2. 容器里 /data/data 是 root:root，需先用 root 建出自定义 prefix 目录
#   3. 顶层包逐个调用，且编译输出写入文件、只在失败时回显关键行
#
# 触发：push 到 master 且 commit message 带 [build]，或手动 Run workflow。

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      packages:
        description: "空格分隔的包名（依赖由 build-package.sh 自动递归构建）"
        required: true
        default: "apt bash bzip2 command-not-found coreutils curl dash diffutils findutils gawk grep gzip less procps psmisc sed tar termux-core termux-exec termux-keyring termux-tools util-linux xz-utils ed debianutils dos2unix inetutils lsof nano net-tools patch unzip"
      arch:
        description: "目标架构"
        required: true
        default: aarch64
        type: choice
        options:
          - aarch64
          - arm
          - i686
          - x86_64
      free-space:
        description: "构建前释放磁盘空间"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fork-build
  cancel-in-progress: false

env:
  FORK_APP_PACKAGE_NAME: bin.mt.plus
  FORK_PREFIX_SUBDIR: usr
  FORK_HOME_SUBDIR: home

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[build]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Apply custom package name
      run: |
        sed -i -E "s@^TERMUX_APP__PACKAGE_NAME=\"com\.termux\"\$@TERMUX_APP__PACKAGE_NAME=\"${FORK_APP_PACKAGE_NAME}\"@" scripts/properties.sh
        git diff --stat
        bash -c '. scripts/properties.sh; echo "PREFIX = $TERMUX__PREFIX"'

    - name: Create builder container and custom prefix
      run: |
        ./scripts/run-docker.sh true
        docker exec -u root termux-package-builder mkdir -p \
            "/data/data/${FORK_APP_PACKAGE_NAME}/files/${FORK_PREFIX_SUBDIR}" \
            "/data/data/${FORK_APP_PACKAGE_NAME}/files/${FORK_HOME_SUBDIR}"
        docker exec -u root termux-package-builder chown -R builder:builder \
            "/data/data/${FORK_APP_PACKAGE_NAME}"

    - name: Free additional disk space
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.free-space }}
      run: ./scripts/free-space.sh

    # 编译输出写入 /tmp/build-logs/<pkg>.log，不打进 Actions 日志。
    # 失败时只回显关键错误行 + 末尾 20 行，并把摘要写进 artifacts/errors.txt
    - name: Build packages
      run: |
        set -uo pipefail
        ARCH='${{ inputs.arch || 'aarch64' }}'
        PKGS='${{ inputs.packages || 'apt bash bzip2 command-not-found coreutils curl dash diffutils findutils gawk grep gzip less procps psmisc sed tar termux-core termux-exec termux-keyring termux-tools util-linux xz-utils ed debianutils dos2unix inetutils lsof nano net-tools patch unzip' }}'
        LOGDIR=/tmp/build-logs
        mkdir -p "$LOGDIR" artifacts
        : > artifacts/errors.txt
        failed=""
        ok_count=0

        for pkg in $PKGS; do
          log="$LOGDIR/$pkg.log"
          echo "::group::build $pkg"
          ./scripts/run-docker.sh -d ./build-package.sh -I -C -a "$ARCH" "$pkg" >"$log" 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then
            ok_count=$((ok_count + 1))
            echo "✅ OK: $pkg  ($(wc -l < "$log") 行日志，已存档)"
          else
            failed="$failed $pkg"
            echo "::error title=构建失败: $pkg (exit $rc)::看下面回显的错误行即可，完整日志见 artifact 里的 errors.txt"
            echo "--- 关键错误行 ---"
            grep -nE 'ERROR|No files in package|error:|Error [0-9]|undefined reference|cannot find|No such file|fatal error' "$log" | tail -30 || true
            echo "--- 末尾 20 行 ---"
            tail -20 "$log"
            {
              echo "############################################################"
              echo "# 包: $pkg   exit=$rc   日志行数: $(wc -l < "$log")"
              echo "############################################################"
              echo "--- 关键错误行 ---"
              grep -nE 'ERROR|No files in package|error:|Error [0-9]|undefined reference|cannot find|No such file|fatal error' "$log" | tail -40 || true
              echo
              echo "--- 末尾 60 行 ---"
              tail -60 "$log"
              echo
            } >> artifacts/errors.txt
          fi
          echo "::endgroup::"
        done

        total=$(echo $PKGS | wc -w)
        echo ""
        echo "=============================================="
        echo "成功: $ok_count / $total"
        echo "失败:${failed:- 无}"
        echo "已产出 deb: $(ls output/*.deb 2>/dev/null | wc -l) 个"
        echo "=============================================="
        {
          echo "### 构建结果"
          echo ""
          echo "- 成功: **$ok_count / $total**"
          echo "- 失败:\`${failed:- 无}\`"
          echo "- 产出 deb: $(ls output/*.deb 2>/dev/null | wc -l) 个"
        } >> "$GITHUB_STEP_SUMMARY"
        [ -z "$failed" ]

    # 与官方一致：deb 文件名里可能含 ':'（epoch），不能直接上传，须先打 tar
    - name: Generate build artifacts
      if: always()
      run: |
        set -u
        ARCH='${{ inputs.arch || 'aarch64' }}'
        mkdir -p artifacts debs
        shopt -s nullglob
        debs=(output/*.deb)
        echo "共产出 ${#debs[@]} 个 .deb"
        if [ ${#debs[@]} -gt 0 ]; then
          cp "${debs[@]}" debs/
          ls -1 debs/*.deb | head -5
          echo "--- 路径抽查 ---"
          dpkg-deb -c "${debs[0]}" | head -3
        else
          echo "::error::output/ 里没有 .deb"
        fi
        tar cf "artifacts/debs-${ARCH}-${GITHUB_SHA}.tar" debs
        ls -lh artifacts/

    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debs-${{ inputs.arch || 'aarch64' }}-${{ github.sha }}
        path: ./artifacts
